<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Дерево життя">
  <!--
    Упрощённый знак для мелких размеров: кольцо, крона, ствол и корни.
    Тонкие ветви и листья исходного логотипа на 16-32 px превращаются
    в пятно, поэтому здесь оставлены только крупные формы.

    Узнаваемость держится на зеркальности: крона вверху и такой же
    развёрнутый веер корней внизу. Без корней силуэт читается как гриб.

    Цвет — золото логотипа (#dfac2d), притемнённое до #b8861a ради
    читаемости на светлой панели вкладок (контраст 3.25:1 вместо 2.0:1).
  -->
  <g fill="none" stroke="#b8861a" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="28" stroke-width="3.5" />

    <!-- крона: три доли, приподняты, чтобы не слипались со стволом -->
    <g fill="#b8861a" stroke="none">
      <circle cx="23" cy="21" r="7.5" />
      <circle cx="41" cy="21" r="7.5" />
      <circle cx="32" cy="16" r="9" />
    </g>

    <!-- ствол -->
    <path d="M32 21 L32 40" stroke-width="5" />

    <!-- корни: веер той же весомости, что и крона, отражённый вниз -->
    <path d="M32 40 L32 51" stroke-width="4" />
    <path d="M32 42 C 29 46, 24.5 48, 19 49.5" stroke-width="4" />
    <path d="M32 42 C 35 46, 39.5 48, 45 49.5" stroke-width="4" />
  </g>
</svg>
